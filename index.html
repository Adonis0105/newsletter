<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abonnement à la Newsletter</title>
    <link rel="stylesheet" href="assets/css/gauche1.css" />
    <link rel="stylesheet" href="assets/css/droite1.css" />
    <link rel="stylesheet" href="assets/css/global1.css" />
    <link rel="stylesheet" href="assets/css/resposivite.css" />
  </head>
  <body>
    <div style="height: 550px" class="container">
      <!-- Bloc gauche -->
      <div class="left">
        <h1>Restez informé !</h1>
        <p>
          Rejoignez plus de 60 000 chefs de produit qui reçoivent des mises à
          jour mensuelles sur :
        </p>
        <ul>
          <li>La découverte de produits et la création de ce qui compte</li>
          <li>La mesure pour garantir le succès des mises à jour</li>
          <li>Et bien plus encore !</li>
        </ul>

        <form id="emailForm" class="email-form">
          <input
            id="emailInput"
            style="width: 400px"
            type="email"
            placeholder="Adresse email"
            required
          />
          <button style="width: 420px" type="submit">
            S'abonner à la newsletter mensuelle
          </button>
        </form>
      </div>

      <!-- Bloc droit -->
      <div class="right">
        <img
          src="assets/images/illustration-sign-up-desktop.svg"
          alt="Graphiques et métriques"
        />
      </div>
    </div>
    <script src="assets/js/main.js"></script>
  </body>
</html>
